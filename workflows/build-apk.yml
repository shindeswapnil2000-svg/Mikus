name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taskmaster-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Taskmaster.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Taskmaster.apk \
            --target "${{ github.sha }}" \
            --title "Taskmaster build ${{ github.run_number }}" \
            --notes "Open this page on your Android phone and download Taskmaster.apk."
